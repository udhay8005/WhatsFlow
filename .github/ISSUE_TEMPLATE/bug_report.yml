name: 🐛 Bug Report
description: Report a bug or unexpected behaviour in WhatsFlow
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in as much detail as possible so we can reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When I click 'Start Campaign', the app crashes with error..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behaviour.
      placeholder: |
        1. Open WhatsFlow
        2. Go to 'New Campaign'
        3. Upload contacts CSV
        4. Click 'Start'
        5. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include error messages and screenshots if possible.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: WhatsFlow Version
      description: Check Help > About or the title bar.
      placeholder: "1.0.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Windows 7/8
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant logs from `backend/logs/` or the Electron console.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Before Submitting
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have NOT included my WhatsApp credentials or `.env` values in this report
          required: true
