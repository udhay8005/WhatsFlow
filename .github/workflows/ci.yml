# ============================================================
# CI — WhatsFlow
# Runs lint + unit tests on every push and pull request.
# Author: Udhaya Chandra SA
# ============================================================

name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend: Lint + Type-check + Unit tests ─────────────────
  frontend:
    name: Frontend (Lint · Type · Test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true   # TypeScript errors are warnings for now

      - name: Unit tests
        run: npm test -- --run --reporter=verbose

  # ── Backend: Unit tests ──────────────────────────────────────
  backend:
    name: Backend (Unit Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit tests
        run: npm run test:unit -- --forceExit
        env:
          NODE_ENV: test

  # ── Build verification ───────────────────────────────────────
  build-check:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
